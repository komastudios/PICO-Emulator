# Build the PICO Spatial Emulator for Linux with podman.
#
#   task                 list the tasks
#   task build           build the image, then extract the package to dist/
#   task debug           build the debug variant (gfxstream pico-linux-debug)
#   task install         extract, then install onto this host (needs root)
#   task lock            re-resolve the manifest and pin it in revisions.lock
#
# Repeated builds reuse CACHE_DIR, which holds the repo checkout (~108 GB once
# synced). The first build syncs it; later builds reuse it, and podman's layer
# cache skips the compile entirely when only the deploy stage changed.
#
# On a host whose rootless podman has no systemd user session, run with:
#   PODMAN_FLAGS="--cgroup-manager=cgroupfs --events-backend=file" task build

version: '3'

vars:
  PODMAN: '{{.PODMAN | default "podman"}}'
  # Extra global podman flags, before the subcommand.
  PODMAN_FLAGS: '{{.PODMAN_FLAGS | default ""}}'
  IMAGE: '{{.IMAGE | default "localhost/pico-emulator"}}'
  # Digest-pinned: the base layer is an input to every binary the build emits.
  # Re-resolve with: podman pull docker.io/library/debian:13-slim &&
  #   podman image inspect docker.io/library/debian:13-slim --format '{{"{{"}}index .RepoDigests 0{{"}}"}}'
  DEBIAN_IMAGE: '{{.DEBIAN_IMAGE | default "docker.io/library/debian@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f"}}'
  CACHE_DIR: '{{.CACHE_DIR | default (printf "%s/.cache" .ROOT_DIR)}}'
  DIST_DIR: '{{.DIST_DIR | default (printf "%s/dist" .ROOT_DIR)}}'
  JOBS:
    sh: nproc
  # DEBUG=1 selects the debug manifest and image tag. `task debug` sets it.
  DEBUG: '{{.DEBUG | default "0"}}'
  TAG: '{{if eq .DEBUG "1"}}debug{{else}}latest{{end}}'
  VARIANT: '{{if eq .DEBUG "1"}}-debug{{else}}{{end}}'
  MANIFEST_FILE: 'pico/emu-35-rom{{.VARIANT}}.xml'
  LOCK_FILE: 'revisions{{.VARIANT}}.lock'
  PINS_FILE: 'manifests/pins{{.VARIANT}}.xml'
  # Read the locked manifest commit; empty if the lock is missing.
  MANIFEST_REV:
    sh: sed -n 's/^MANIFEST_REV=//p' '{{.ROOT_DIR}}/revisions{{if eq (.DEBUG | default "0") "1"}}-debug{{end}}.lock' 2>/dev/null || true
  # Fixed build timestamp, recorded in the lock alongside the manifest commit.
  SOURCE_DATE_EPOCH:
    sh: sed -n 's/^SOURCE_DATE_EPOCH=//p' '{{.ROOT_DIR}}/revisions{{if eq (.DEBUG | default "0") "1"}}-debug{{end}}.lock' 2>/dev/null || true
  MANIFEST_URL: '{{.MANIFEST_URL | default "https://github.com/komastudios/PICO-Emulator-manifest.git"}}'
  MANIFEST_BRANCH: '{{.MANIFEST_BRANCH | default "pico-linux"}}'
  # Compiler cache: "none" (deterministic, the default) or "auto" (faster).
  COMPILER_CACHE: '{{.COMPILER_CACHE | default "none"}}'
  # Bump to force a re-sync and recompile even with a warm cache.
  CACHE_BUST: '{{.CACHE_BUST | default "0"}}'
  BUILD_FLAGS: '{{.BUILD_FLAGS | default ""}}'
  # Staged pipeline (see docs/build-pipeline.md, "Stages and promotion").
  # LOCK_KEY names the trimmed source archive: a content hash of the lock, the
  # pins and the trim rules. BUILDER_KEY names the toolchain image.
  LOCK_KEY:
    sh: cat '{{.ROOT_DIR}}/revisions{{if eq (.DEBUG | default "0") "1"}}-debug{{end}}.lock' '{{.ROOT_DIR}}/manifests/pins{{if eq (.DEBUG | default "0") "1"}}-debug{{end}}.xml' '{{.ROOT_DIR}}/scripts/source-trim.txt' '{{.ROOT_DIR}}/scripts/source-required.txt' '{{.ROOT_DIR}}/scripts/source-exclude.txt' '{{.ROOT_DIR}}/scripts/build-sync.sh' '{{.ROOT_DIR}}/scripts/build-trim.sh' '{{.ROOT_DIR}}/native/patch.lock' '{{.ROOT_DIR}}/patches/pico-native-automation.patch' '{{.ROOT_DIR}}/scripts/apply-native-patch.sh' 2>/dev/null | sha256sum | cut -c1-16
  BUILDER_KEY:
    sh: sh -c "sed -n '/^FROM base AS builder/,/^# -* sources/p' '{{.ROOT_DIR}}/Containerfile'; printf '%s' '{{.DEBIAN_IMAGE}}'" | sha256sum | cut -c1-16
  REGISTRY: '{{.REGISTRY | default "ghcr.io/komastudios"}}'
  SOURCES_REF: '{{.SOURCES_REF | default (printf "%s/pico-emulator-sources:%s" .REGISTRY .LOCK_KEY)}}'
  BUILDER_REF: '{{.BUILDER_REF | default (printf "%s/pico-emulator-builder:%s" .REGISTRY .BUILDER_KEY)}}'
  # The toolchain image the compile stage starts from: the local builder stage
  # by default, or a pulled image reference (BUILDER_IMAGE=ghcr.io/...@sha256:...).
  BUILDER_IMAGE: '{{.BUILDER_IMAGE | default "builder"}}'
  SOURCE_ARCHIVE: '{{.SOURCE_ARCHIVE | default (printf "%s/sources-%s.tar.zst" .CACHE_DIR .LOCK_KEY)}}'
  # 1 frees the source archive once the compile stage has unpacked it.
  DISCARD_SOURCE_ARCHIVE: '{{.DISCARD_SOURCE_ARCHIVE | default "0"}}'
  SYNC_DEPTH: '{{.SYNC_DEPTH | default ""}}'
  SYNC_PARTIAL: '{{.SYNC_PARTIAL | default "0"}}'
  ZSTD_LEVEL: '{{.ZSTD_LEVEL | default "12"}}'
  # Guest image directory to bind-mount for `task run`. Must be the extracted
  # system-images directory from the vendor archive; see README.md.
  SYSTEM_IMAGES: '{{.SYSTEM_IMAGES | default ""}}'
  STATE_VOLUME: '{{.STATE_VOLUME | default "pico-emulator-state"}}'
  GUEST_MOUNT: /opt/android/PICO/linux-pico-package/swan_rls_spaceos_oversea_K_pico_emulator_win64_20260731_ide/system-images/system-images

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds: ['task --list']

  build:
    desc: Build the image and extract the package to dist/
    cmds:
      - mkdir -p '{{.CACHE_DIR}}'
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} build
        --file Containerfile
        --target deploy
        --tag {{.IMAGE}}:{{.TAG}}
        --volume '{{.CACHE_DIR}}:/cache:z'
        --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}}
        --build-arg MANIFEST_URL={{.MANIFEST_URL}}
        --build-arg MANIFEST_BRANCH={{.MANIFEST_BRANCH}}
        --build-arg MANIFEST_FILE={{.MANIFEST_FILE}}
        --build-arg MANIFEST_REV={{.MANIFEST_REV}}
        --build-arg LOCK_FILE={{if .MANIFEST_REV}}/opt/pico/{{.LOCK_FILE}}{{end}}
        --build-arg PINS_FILE={{if .MANIFEST_REV}}/opt/pico/{{.PINS_FILE}}{{end}}
        --build-arg SOURCE_DATE_EPOCH={{.SOURCE_DATE_EPOCH}}
        --build-arg COMPILER_CACHE={{.COMPILER_CACHE}}
        --build-arg JOBS={{.JOBS}}
        --build-arg CACHE_BUST={{.CACHE_BUST}}
        {{.BUILD_FLAGS}} .
      - printf '\nBuilt %s:%s (manifest %s%s)\n' '{{.IMAGE}}' '{{.TAG}}' '{{.MANIFEST_FILE}}' '{{if .MANIFEST_REV}} @ {{.MANIFEST_REV}}{{else}} — unlocked, run `task lock`{{end}}'
      - task: extract

  debug:
    desc: Build the debug variant (gfxstream pico-linux-debug, dumps SPIR-V shaders)
    cmds:
      - task: build
        vars: {DEBUG: '1'}

  extract:
    desc: Copy the deployable package out of the built image into dist/
    cmds:
      - '{{.PODMAN}} {{.PODMAN_FLAGS}} image exists {{.IMAGE}}:{{.TAG}} || { echo "image {{.IMAGE}}:{{.TAG}} not found; run ''task build'' first" >&2; exit 1; }'
      - rm -rf '{{.DIST_DIR}}/linux-pico-package'
      - mkdir -p '{{.DIST_DIR}}'
      - |
        cid="$({{.PODMAN}} {{.PODMAN_FLAGS}} create {{.IMAGE}}:{{.TAG}})"
        trap '{{.PODMAN}} {{.PODMAN_FLAGS}} rm -f "$cid" >/dev/null 2>&1' EXIT
        # Through a tar stream rather than straight onto the filesystem: a
        # rootful podman writes a direct copy as root, and the rest of this
        # task then cannot write into it. tar runs as the caller, so the tree
        # belongs to them; -p keeps the archived modes for a non-root extract.
        {{.PODMAN}} {{.PODMAN_FLAGS}} cp \
          "$cid:/opt/android/PICO/linux-pico-package" - | tar -C '{{.DIST_DIR}}' -xpf -
        test -x '{{.DIST_DIR}}/linux-pico-package/picoemulator/emulator' || {
          echo "extract produced no package tree" >&2; exit 1; }
      - printf '%s\n' '{{.TAG}}' > '{{.DIST_DIR}}/linux-pico-package/.build-variant'
      - |
        cd '{{.DIST_DIR}}/linux-pico-package' && sha256sum \
          picoemulator/emulator \
          picoemulator/qemu/linux-x86_64/qemu-system-x86_64 \
          picoemulator/lib64/libgfxstream_backend.so \
          picoemulator/lib64/vulkan/libvulkan_lvp.so > SHA256SUMS
      - printf 'Extracted to %s (%s)\n' '{{.DIST_DIR}}/linux-pico-package' "$(du -sh '{{.DIST_DIR}}/linux-pico-package' | cut -f1)"
      - cat '{{.DIST_DIR}}/linux-pico-package/SHA256SUMS'

  install:
    desc: Install the extracted package and systemd units on this host (needs root)
    deps: [extract]
    cmds:
      - scripts/install-pico-emulator.sh --source '{{.DIST_DIR}}/linux-pico-package'

  run:
    desc: Run the emulator from the built image (set SYSTEM_IMAGES=...)
    preconditions:
      - sh: test -n '{{.SYSTEM_IMAGES}}'
        msg: "SYSTEM_IMAGES is not set. Pass the extracted system-images directory, e.g. task run SYSTEM_IMAGES=/srv/pico/system-images"
    cmds:
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} run --rm -it
        --device /dev/kvm
        --volume '{{.SYSTEM_IMAGES}}:{{.GUEST_MOUNT}}:ro,z'
        --volume '{{.STATE_VOLUME}}:/var/lib/android:z'
        --publish 5037:5037
        {{.IMAGE}}:{{.TAG}}

  shell:
    desc: Interactive shell in the built image
    cmds:
      - '{{.PODMAN}} {{.PODMAN_FLAGS}} run --rm -it --entrypoint /bin/bash {{.IMAGE}}:{{.TAG}}'

  lock:
    desc: Re-resolve the manifest and project revisions into the lock files
    cmds:
      - scripts/write-lock.py
      - scripts/write-lock.py --debug

  lock:check:
    desc: Fail if the lock files are stale against the current branch tips
    cmds:
      - scripts/write-lock.py --check
      - scripts/write-lock.py --debug --check

  lock:key:
    desc: Print the content keys that name the promoted stage artifacts
    silent: true
    cmds:
      - printf 'LOCK_KEY=%s\nBUILDER_KEY=%s\nSOURCES_REF=%s\nBUILDER_REF=%s\n' '{{.LOCK_KEY}}' '{{.BUILDER_KEY}}' '{{.SOURCES_REF}}' '{{.BUILDER_REF}}'

  sources:
    desc: "Stage 1: sync the locked manifest, trim to Linux inputs, archive to CACHE_DIR"
    preconditions:
      - sh: test -n '{{.MANIFEST_REV}}'
        msg: "The sources stage needs a lock; run `task lock` first."
    cmds:
      - mkdir -p '{{.CACHE_DIR}}'
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} build
        --file Containerfile
        --target sources
        --tag {{.IMAGE}}-sources:{{.TAG}}
        --volume '{{.CACHE_DIR}}:/cache:z'
        --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}}
        --build-arg MANIFEST_URL={{.MANIFEST_URL}}
        --build-arg MANIFEST_BRANCH={{.MANIFEST_BRANCH}}
        --build-arg MANIFEST_FILE={{.MANIFEST_FILE}}
        --build-arg MANIFEST_REV={{.MANIFEST_REV}}
        --build-arg LOCK_FILE=/opt/pico/{{.LOCK_FILE}}
        --build-arg PINS_FILE=/opt/pico/{{.PINS_FILE}}
        --build-arg SOURCE_DATE_EPOCH={{.SOURCE_DATE_EPOCH}}
        --build-arg LOCK_KEY={{.LOCK_KEY}}
        --build-arg SYNC_DEPTH={{.SYNC_DEPTH}}
        --build-arg SYNC_PARTIAL={{.SYNC_PARTIAL}}
        --build-arg ZSTD_LEVEL={{.ZSTD_LEVEL}}
        --build-arg JOBS={{.JOBS}}
        --build-arg CACHE_BUST={{.CACHE_BUST}}
        {{.BUILD_FLAGS}} .
      - ls -l '{{.CACHE_DIR}}/sources-{{.LOCK_KEY}}.tar.zst' && cat '{{.CACHE_DIR}}/sources-{{.LOCK_KEY}}.tar.sha256'

  sources:push:
    desc: Promote the source archive to the registry as an OCI artifact (needs oras)
    cmds:
      - scripts/promote.sh push-sources '{{.CACHE_DIR}}' '{{.LOCK_KEY}}' '{{.SOURCES_REF}}'

  sources:pull:
    desc: Fetch a promoted source archive into CACHE_DIR (needs oras)
    cmds:
      - mkdir -p '{{.CACHE_DIR}}'
      - scripts/promote.sh pull-sources '{{.CACHE_DIR}}' '{{.LOCK_KEY}}' '{{.SOURCES_REF}}'

  builder:image:
    desc: "Stage 2: build the toolchain image"
    cmds:
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} build
        --file Containerfile
        --target builder
        --tag {{.BUILDER_REF}}
        --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}}
        {{.BUILD_FLAGS}} .

  builder:push:
    desc: Push the toolchain image and print its digest
    cmds:
      - '{{.PODMAN}} {{.PODMAN_FLAGS}} push {{.BUILDER_REF}}'
      - '{{.PODMAN}} {{.PODMAN_FLAGS}} image inspect {{.BUILDER_REF}} --format "{{"{{"}}.Digest{{"}}"}}"'

  compile:
    desc: "Stage 3: compile from the source archive; emits dist/picoemulator-<key>.tar.zst"
    preconditions:
      - sh: test -f '{{.SOURCE_ARCHIVE}}'
        msg: "No source archive at {{.SOURCE_ARCHIVE}}; run `task sources` or `task sources:pull`."
    cmds:
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} build
        --file Containerfile
        --target build
        --tag {{.IMAGE}}-build:{{.TAG}}
        --volume '{{.CACHE_DIR}}:/cache:z'
        --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}}
        --build-arg BUILDER_IMAGE={{.BUILDER_IMAGE}}
        --build-arg MANIFEST_URL={{.MANIFEST_URL}}
        --build-arg MANIFEST_BRANCH={{.MANIFEST_BRANCH}}
        --build-arg MANIFEST_FILE={{.MANIFEST_FILE}}
        --build-arg MANIFEST_REV={{.MANIFEST_REV}}
        --build-arg SOURCE_DATE_EPOCH={{.SOURCE_DATE_EPOCH}}
        --build-arg COMPILER_CACHE={{.COMPILER_CACHE}}
        --build-arg SOURCE_ARCHIVE=/cache/{{base .SOURCE_ARCHIVE}}
        --build-arg DISCARD_SOURCE_ARCHIVE={{.DISCARD_SOURCE_ARCHIVE}}
        --build-arg LOCK_KEY={{.LOCK_KEY}}
        --build-arg JOBS={{.JOBS}}
        --build-arg CACHE_BUST={{.CACHE_BUST}}
        {{.BUILD_FLAGS}} .
      - mkdir -p '{{.DIST_DIR}}'
      - |
        cid="$({{.PODMAN}} {{.PODMAN_FLAGS}} create {{.IMAGE}}-build:{{.TAG}})"
        trap '{{.PODMAN}} {{.PODMAN_FLAGS}} rm -f "$cid" >/dev/null 2>&1' EXIT
        for f in picoemulator-{{.LOCK_KEY}}.tar.zst picoemulator-{{.LOCK_KEY}}.tar.sha256; do
          {{.PODMAN}} {{.PODMAN_FLAGS}} cp "$cid:/out/$f" '{{.DIST_DIR}}/'
        done
      - ls -l '{{.DIST_DIR}}/picoemulator-{{.LOCK_KEY}}.tar.zst' && cat '{{.DIST_DIR}}/picoemulator-{{.LOCK_KEY}}.tar.sha256'

  package:
    desc: "Stage 4: build the runtime image from a package archive and extract it (PACKAGE=<tar.zst>)"
    vars:
      PACKAGE: '{{.PACKAGE | default (printf "%s/picoemulator-%s.tar.zst" .DIST_DIR .LOCK_KEY)}}'
    preconditions:
      - sh: test -f '{{.PACKAGE}}'
        msg: "No package archive at {{.PACKAGE}}; run `task compile` or download the artifact."
    cmds:
      # The import stage reads the archive from the build context.
      - mkdir -p '{{.ROOT_DIR}}/dist' && cp -f '{{.PACKAGE}}' '{{.ROOT_DIR}}/dist/picoemulator.tar.zst'
      - >
        {{.PODMAN}} {{.PODMAN_FLAGS}} build
        --file Containerfile
        --target deploy
        --tag {{.IMAGE}}:{{.TAG}}
        --build-arg DEBIAN_IMAGE={{.DEBIAN_IMAGE}}
        --build-arg PACKAGE_STAGE=import
        --build-arg PICOEMULATOR_TAR=dist/picoemulator.tar.zst
        {{.BUILD_FLAGS}} .
      - task: extract

  ci:cleanup:
    desc: Free disk on a GitHub-hosted runner (no-op elsewhere); prints CACHE_DIR/GRAPHROOT
    cmds:
      - scripts/ci-cleanup.sh

  release:
    desc: "Stage 5: self-contained release archive from an extracted package (PACKAGE_DIR=<dir>)"
    vars:
      PACKAGE_DIR: '{{.PACKAGE_DIR | default (printf "%s/linux-pico-package" .DIST_DIR)}}'
      VERSION: '{{.VERSION | default ""}}'
    preconditions:
      - sh: test -x '{{.PACKAGE_DIR}}/picoemulator/emulator'
        msg: "No extracted package at {{.PACKAGE_DIR}}; run `task package` or `task build` first."
    cmds:
      - scripts/make-release.sh --package '{{.PACKAGE_DIR}}' --out '{{.DIST_DIR}}' --lock-key '{{.LOCK_KEY}}' {{if .VERSION}}--version '{{.VERSION}}'{{end}}

  repro:check:
    desc: Compare two extracted packages byte for byte (A=<dir> B=<dir>)
    preconditions:
      - sh: test -n '{{.A}}' && test -n '{{.B}}'
        msg: "Pass both packages, e.g. task repro:check A=/path/a/linux-pico-package B=/path/b/linux-pico-package"
    cmds:
      - scripts/repro-check.sh '{{.A}}' '{{.B}}' '{{.DIST_DIR}}/repro-report.txt'

  verify:
    desc: Check repository completeness, script syntax, units and file modes
    cmds:
      - scripts/validate-repository.sh

  cache-info:
    desc: Show what the build cache is holding
    silent: true
    cmds:
      - |
        if [ -d '{{.CACHE_DIR}}' ]; then
          du -sh '{{.CACHE_DIR}}' 2>/dev/null
          du -sh '{{.CACHE_DIR}}'/* 2>/dev/null || true
        else
          echo "no cache at {{.CACHE_DIR}}"
        fi

  clean-cache:
    desc: Delete the build cache; the next build re-syncs from scratch
    cmds:
      - rm -rf '{{.CACHE_DIR}}'

  clean:
    desc: Remove the built image and dist/
    cmds:
      - '{{.PODMAN}} {{.PODMAN_FLAGS}} rmi {{.IMAGE}}:{{.TAG}} || true'
      - rm -rf '{{.DIST_DIR}}'

  config:
    desc: Print the resolved configuration without building
    silent: true
    cmds:
      - |
        printf '%-16s %s\n' \
          PODMAN          '{{.PODMAN}} {{.PODMAN_FLAGS}}' \
          IMAGE           '{{.IMAGE}}:{{.TAG}}' \
          DEBUG           '{{.DEBUG}}' \
          MANIFEST_URL    '{{.MANIFEST_URL}}' \
          MANIFEST_BRANCH '{{.MANIFEST_BRANCH}}' \
          MANIFEST_FILE   '{{.MANIFEST_FILE}}' \
          MANIFEST_REV    '{{if .MANIFEST_REV}}{{.MANIFEST_REV}}{{else}}(unlocked){{end}}' \
          SOURCE_DATE_EPOCH '{{if .SOURCE_DATE_EPOCH}}{{.SOURCE_DATE_EPOCH}}{{else}}(unset){{end}}' \
          COMPILER_CACHE  '{{.COMPILER_CACHE}}' \
          LOCK_FILE       '{{.LOCK_FILE}}' \
          PINS_FILE       '{{.PINS_FILE}}' \
          CACHE_DIR       '{{.CACHE_DIR}}' \
          JOBS            '{{.JOBS}}' \
          DEBIAN_IMAGE    '{{.DEBIAN_IMAGE}}' \
          DIST_DIR        '{{.DIST_DIR}}' \
          SYSTEM_IMAGES   '{{.SYSTEM_IMAGES}}'
