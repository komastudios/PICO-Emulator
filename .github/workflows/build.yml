# Staged reproducible build. Each stage promotes its artifact and can be
# re-run alone from the previous stage's promotion:
#
#   keys ─┬─ builder ─┐
#         └─ sources ─┴─ compile (a, b) ─ package
#
# sources: lock-governed repo sync, trimmed to Linux inputs, pushed to ghcr.io
#          as sources:<LOCK_KEY>. Skipped when that tag already exists.
# builder: toolchain image, pushed as builder:<BUILDER_KEY>. Skipped likewise.
# compile: rebuild.sh from the promoted archive. One leg on any branch; two
#          legs on independent runners on the `snapshot` branch.
# package: runtime image from the archive, extract; on `snapshot` compare a
#          against b and, only if they are byte-identical, publish a release
#          archive as tag v0.<commit count> with a GitHub Release.
name: build

on:
  workflow_dispatch:
    inputs:
      debug:
        description: Build the gfxstream debug variant
        type: boolean
        default: false
      sources_ref:
        description: Use this promoted sources reference instead of the lock's key
        type: string
        default: ''
      builder_ref:
        description: Use this builder image reference instead of the Containerfile's key
        type: string
        default: ''
      force_sources:
        description: Re-run the sources stage even if its promotion exists
        type: boolean
        default: false
      run_second_build:
        description: Compile twice on separate runners and compare (always on for snapshot)
        type: boolean
        default: false
      publish:
        description: Publish a release when the two builds agree (always on for snapshot)
        type: boolean
        default: false
      sync_depth:
        description: repo init --depth for the sources stage (empty = full history)
        type: string
        default: '1'
  push:
    branches: ['**']
    paths:
      - revisions.lock
      - revisions-debug.lock
      - manifests/**
      - Containerfile
      - Taskfile.yml
      - scripts/**
      - .github/workflows/build.yml
      - .github/actions/setup-tools/action.yml

# contents stays read for the whole workflow; only the job that cuts a release
# gets write, so a compromised build stage cannot push to the repository.
permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.debug && 'debug' || 'release' }}
  cancel-in-progress: false

env:
  DEBUG: ${{ inputs.debug && '1' || '0' }}
  # Rootful podman avoids the rootless cgroup and storage quirks on runners;
  # storage is pointed at a disk with room by ci-cleanup. Task reads this as
  # the PODMAN template variable (the environment is its lowest-priority
  # variable source), so every `task` call below builds with `sudo podman`.
  PODMAN: sudo podman

jobs:
  keys:
    name: resolve keys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lock_key: ${{ steps.keys.outputs.lock_key }}
      builder_key: ${{ steps.keys.outputs.builder_key }}
      sources_ref: ${{ steps.keys.outputs.sources_ref }}
      builder_ref: ${{ steps.keys.outputs.builder_ref }}
      sources_exists: ${{ steps.probe.outputs.sources_exists }}
      builder_exists: ${{ steps.probe.outputs.builder_exists }}
      # snapshot always gets the a/b gate; elsewhere only a dispatch asks for it
      # (on push `inputs` is empty, so test the ref first).
      second_build: ${{ (github.ref == 'refs/heads/snapshot' || inputs.run_second_build == true) && 'true' || 'false' }}
      publish: ${{ (github.ref == 'refs/heads/snapshot' || inputs.publish == true) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          podman: 'false'
      - id: keys
        env:
          IN_SOURCES_REF: ${{ inputs.sources_ref }}
          IN_BUILDER_REF: ${{ inputs.builder_ref }}
        run: |
          eval "$(task lock:key)"
          if [ -n "$IN_SOURCES_REF" ]; then SOURCES_REF="$IN_SOURCES_REF"; fi
          if [ -n "$IN_BUILDER_REF" ]; then BUILDER_REF="$IN_BUILDER_REF"; fi
          {
            echo "lock_key=$LOCK_KEY"; echo "builder_key=$BUILDER_KEY"
            echo "sources_ref=$SOURCES_REF"; echo "builder_ref=$BUILDER_REF"
          } | tee -a "$GITHUB_OUTPUT"
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES_REF: ${{ steps.keys.outputs.sources_ref }}
          BUILDER_REF: ${{ steps.keys.outputs.builder_ref }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if scripts/promote.sh exists "$SOURCES_REF"; then s=true; else s=false; fi
          if scripts/promote.sh exists "$BUILDER_REF"; then b=true; else b=false; fi
          echo "sources_exists=$s" | tee -a "$GITHUB_OUTPUT"
          echo "builder_exists=$b" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          SOURCES_REF: ${{ steps.keys.outputs.sources_ref }}
          BUILDER_REF: ${{ steps.keys.outputs.builder_ref }}
        run: |
          {
            echo "| stage | reference | promoted |"
            echo "| --- | --- | --- |"
            echo "| sources | \`$SOURCES_REF\` | ${{ steps.probe.outputs.sources_exists }} |"
            echo "| builder | \`$BUILDER_REF\` | ${{ steps.probe.outputs.builder_exists }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  builder:
    name: toolchain image
    needs: keys
    if: needs.keys.outputs.builder_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_REF: ${{ needs.keys.outputs.builder_ref }}
        run: |
          echo "$GH_TOKEN" | $PODMAN login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          task builder:image BUILDER_REF="$BUILDER_REF"
          task builder:push BUILDER_REF="$BUILDER_REF"

  sources:
    name: source archive
    needs: keys
    if: needs.keys.outputs.sources_exists == 'false' || inputs.force_sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - id: disk
        run: task ci:cleanup | tee -a "$GITHUB_OUTPUT"
      - name: Sync, trim, archive
        env:
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
          SYNC_DEPTH: ${{ inputs.sync_depth || '1' }}
        run: |
          task sources \
            CACHE_DIR="$CACHE_DIR" \
            PODMAN_FLAGS="--root $GRAPHROOT" \
            SYNC_DEPTH="$SYNC_DEPTH" JOBS=4
          df -h "$CACHE_DIR" "$GRAPHROOT"
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          SOURCES_REF: ${{ needs.keys.outputs.sources_ref }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          task sources:push CACHE_DIR="$CACHE_DIR" SOURCES_REF="$SOURCES_REF"
      - name: Record the archive identity
        if: always()
        env:
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          LOCK_KEY: ${{ needs.keys.outputs.lock_key }}
        run: |
          sha="$(cat "$CACHE_DIR/sources-$LOCK_KEY.tar.sha256" 2>/dev/null || echo '(not produced)')"
          {
            echo "## sources $LOCK_KEY"
            echo "- uncompressed content sha256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive listing
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ needs.keys.outputs.lock_key }}-listing
          path: |
            ${{ steps.disk.outputs.CACHE_DIR }}/sources-*.tar.zst.list
            ${{ steps.disk.outputs.CACHE_DIR }}/sources-*.tar.sha256
          retention-days: 90

  compile:
    name: compile (${{ matrix.run }})
    needs: [keys, builder, sources]
    # Run when the prerequisites either succeeded or were skipped as already promoted.
    if: always() && needs.keys.result == 'success' && needs.builder.result != 'failure' && needs.sources.result != 'failure' && needs.builder.result != 'cancelled' && needs.sources.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.keys.outputs.second_build == 'true' && '["a","b"]' || '["a"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - id: disk
        run: task ci:cleanup | tee -a "$GITHUB_OUTPUT"
      - name: Fetch the source archive and builder image
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
          SOURCES_REF: ${{ needs.keys.outputs.sources_ref }}
          BUILDER_REF: ${{ needs.keys.outputs.builder_ref }}
          LOCK_KEY: ${{ needs.keys.outputs.lock_key }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | $PODMAN --root "$GRAPHROOT" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          task sources:pull CACHE_DIR="$CACHE_DIR" SOURCES_REF="$SOURCES_REF"
          $PODMAN --root "$GRAPHROOT" pull "$BUILDER_REF"
          digest="$($PODMAN --root "$GRAPHROOT" image inspect "$BUILDER_REF" --format '{{ index .RepoDigests 0 }}')"
          echo "BUILDER_DIGEST=$digest" | tee -a "$GITHUB_ENV"
          {
            echo "## compile ${{ matrix.run }}"
            echo "- sources content sha256: \`$(cat "$CACHE_DIR/sources-$LOCK_KEY.tar.sha256")\`"
            echo "- builder: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile
        env:
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
        run: |
          task compile \
            CACHE_DIR="$CACHE_DIR" \
            PODMAN_FLAGS="--root $GRAPHROOT" \
            BUILDER_IMAGE="$BUILDER_DIGEST" COMPILER_CACHE=none \
            DISCARD_SOURCE_ARCHIVE=1 \
            CACHE_BUST='${{ github.run_id }}-${{ matrix.run }}' \
            2>&1 | tee build-${{ matrix.run }}.log
      - name: Disk after the build
        if: always()
        env:
          CACHE_DIR: ${{ steps.disk.outputs.CACHE_DIR }}
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
        run: df -h "$CACHE_DIR" "$GRAPHROOT"
      - name: Upload the package archive
        uses: actions/upload-artifact@v4
        with:
          name: picoemulator-${{ needs.keys.outputs.lock_key }}-${{ matrix.run }}
          path: |
            dist/picoemulator-*.tar.zst
            dist/picoemulator-*.tar.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ needs.keys.outputs.lock_key }}-${{ matrix.run }}
          path: build-${{ matrix.run }}.log
          retention-days: 30

  package:
    name: package and verify
    needs: [keys, compile]
    permissions:
      contents: write
      packages: write
    # always() is load-bearing: a skip propagates down the whole dependency
    # graph, so when builder and sources are skipped as already promoted this
    # job is skipped too unless it opts out, even though compile succeeded.
    if: always() && needs.compile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The release version is the commit count on this branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          diffoscope: 'true'
      - id: disk
        run: task ci:cleanup | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: picoemulator-${{ needs.keys.outputs.lock_key }}-*
          path: in
      - name: Runtime image and package from build a
        env:
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
        run: |
          task package PODMAN_FLAGS="--root $GRAPHROOT" \
            PACKAGE="$(ls in/picoemulator-*-a/picoemulator-*.tar.zst)"
          mv dist/linux-pico-package dist/package-a
      - name: Compare with build b
        if: needs.keys.outputs.second_build == 'true'
        env:
          GRAPHROOT: ${{ steps.disk.outputs.GRAPHROOT }}
        run: |
          task package PODMAN_FLAGS="--root $GRAPHROOT" \
            PACKAGE="$(ls in/picoemulator-*-b/picoemulator-*.tar.zst)"
          mv dist/linux-pico-package dist/package-b
          task repro:check A=dist/package-a B=dist/package-b
      - name: Record the result
        if: always()
        run: |
          {
            echo "## Build ${{ needs.keys.outputs.lock_key }}"
            echo
            if [ -f dist/package-a/SHA256SUMS ]; then
              echo '```'; cat dist/package-a/SHA256SUMS; echo '```'
            else
              echo '(the package stage produced no SHA256SUMS)'
            fi
            echo; echo "- sources: \`${{ needs.keys.outputs.sources_ref }}\`"
            echo "- builder: \`${{ needs.keys.outputs.builder_ref }}\`"
            echo "- second build compared: ${{ needs.keys.outputs.second_build }}"
            if [ -f dist/repro-report.txt ]; then echo; echo '```'; head -40 dist/repro-report.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: linux-pico-package-${{ needs.keys.outputs.lock_key }}
          path: |
            dist/package-a
            dist/repro-report.txt
          retention-days: 90
      - name: Release archive
        # Only from a build that passed the a/b gate: the previous steps fail
        # the job otherwise, so reaching here with second_build=true means the
        # two independent compiles were byte-identical.
        if: needs.keys.outputs.publish == 'true' && needs.keys.outputs.second_build == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_KEY: ${{ needs.keys.outputs.lock_key }}
        run: |
          task release PACKAGE_DIR=dist/package-a DIST_DIR=dist/release | tee release.out
          archive="$(ls dist/release/pico-emulator-linux-*.tar.zst)"
          version="$(basename "$archive" .tar.zst | sed 's/^pico-emulator-linux-//')"
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release $version already exists; not republishing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Reproducible build of the PICO Spatial Emulator Linux host."
            echo
            echo "Two independent GitHub-hosted runners compiled this package byte-identically."
            echo "Install: extract, then \`sudo scripts/install-pico-emulator.sh\` (see README.md inside)."
            echo
            echo '```'; cat dist/package-a/SHA256SUMS; echo '```'
            echo
            echo "- sources: \`${{ needs.keys.outputs.sources_ref }}\`"
            echo "- builder: \`${{ needs.keys.outputs.builder_ref }}\`"
            echo "- lock key: \`$LOCK_KEY\`"
          } > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file notes.md \
            "$archive" "$archive.sha256"
          echo "published release $version" | tee -a "$GITHUB_STEP_SUMMARY"
