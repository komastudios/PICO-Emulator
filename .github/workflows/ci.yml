name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  lint:
    name: repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          podman: 'false'
          oras-version: ''
      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | sudo bash -s -- "$ACTIONLINT_VERSION" /usr/local/bin >/dev/null
          actionlint --version
      - name: Repository completeness, script syntax, file modes
        run: task verify
      - name: Lock files match the fork branch tips
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: task lock:check
      - name: Workflow syntax
        run: actionlint
